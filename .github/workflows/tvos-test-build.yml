name: tvOS test build

on:
  workflow_dispatch:
  push:
    branches:
      - agent/tvos-subtitle-preferences

permissions:
  contents: read

jobs:
  build-tvos:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate tvOS project
        env:
          EXPO_TV: "1"
          SEANIME_TV_DEV: "1"
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        run: |
          cd ios
          pod install
          cd ..

      - name: Find Xcode scheme
        id: xcode
        run: |
          set -e

          WORKSPACE="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"

          if [ -z "$WORKSPACE" ]; then
            echo "No Xcode workspace found"
            exit 1
          fi

          xcodebuild \
            -workspace "$WORKSPACE" \
            -list \
            -json > /tmp/xcode-list.json

          SCHEME="$(python3 - <<'PY'
          import json

          with open("/tmp/xcode-list.json", "r") as f:
              data = json.load(f)

          schemes = data.get("workspace", {}).get("schemes", [])

          if not schemes:
              raise SystemExit("No Xcode schemes found")

          non_pod = [s for s in schemes if not s.lower().startswith("pods")]

          print(non_pod[0] if non_pod else schemes[0])
          PY
          )"

          echo "Workspace: $WORKSPACE"
          echo "Scheme: $SCHEME"

          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"

      - name: Build unsigned tvOS app
        run: |
          set -euxo pipefail

          xcodebuild \
            -workspace "${{ steps.xcode.outputs.workspace }}" \
            -scheme "${{ steps.xcode.outputs.scheme }}" \
            -configuration Release \
            -sdk appletvos \
            -destination 'generic/platform=tvOS' \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package unsigned IPA
        run: |
          set -euxo pipefail

          APP="$(find build/Build/Products \
            -type d \
            -path '*Release-appletvos*' \
            -name '*.app' \
            -print -quit)"

          if [ -z "$APP" ]; then
            echo "No tvOS app was produced."
            find build/Build/Products -maxdepth 5 -print || true
            exit 1
          fi

          mkdir Payload
          cp -R "$APP" Payload/

          zip -qry \
            Seanime-Tenji-tvOS-subtitle-preferences-unsigned.ipa \
            Payload

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Seanime-Tenji-tvOS-subtitle-preferences
          path: Seanime-Tenji-tvOS-subtitle-preferences-unsigned.ipa
          retention-days: 7
          if-no-files-found: error
